<app-page-header title="Equipo" subtitle="Personal, roles y acceso de la tienda seleccionada.">
  @if (auth.hasPermission('manage_staff')) {
    <a class="button primary" [routerLink]="registerRoute">Registrar personal</a>
  }
</app-page-header>
@if (!selectedStore.selectedStoreId()) {
  <section class="card"><p>Selecciona una tienda para consultar su personal.</p></section>
} @else if (loading()) {
  <app-skeleton />
} @else if (failed()) {
  <section class="card">
    <p>No pudimos cargar el equipo.</p>
    <button type="button" (click)="load()">Reintentar</button>
  </section>
} @else {
  <section class="card">
    <app-data-table [columns]="columns" [rows]="rows()" [actions]="actions"
      caption="Personal de la tienda" (rowAction)="handleRowAction($event)" />
    <app-pagination label="Paginación de resultados" [page]="page()" [totalPages]="totalPages()"
    [pageSize]="pageSize" [disabled]="busy() || loading()" (pageChange)="load($event)" (pageSizeChange)="changePageSize($event)" />
  </section>
}
<app-assisted-recovery-dialog />
