<app-page-header title="Equipo" subtitle="Personal, roles y acceso de la tienda seleccionada." />
@if (!selectedStore.selectedStoreId()) {
  <section class="card"><p>Selecciona una tienda para consultar su personal.</p></section>
} @else if (loading()) {
  <app-skeleton />
} @else if (failed()) {
  <section class="card">
    <p>No pudimos cargar el equipo.</p>
    <button type="button" (click)="load()">Reintentar</button>
  </section>
} @else {
  <section class="card">
    <app-data-table [columns]="columns" [rows]="rows()" [actions]="actions"
      caption="Personal de la tienda" (rowAction)="handleRowAction($event)" />
    @if (totalPages() > 1) {
      <nav aria-label="Paginación del personal">
        <button type="button" [disabled]="page() <= 1 || busy()" (click)="load(page() - 1)">Anterior</button>
        <span>Página {{ page() }} de {{ totalPages() }}</span>
        <button type="button" [disabled]="page() >= totalPages() || busy()" (click)="load(page() + 1)">Siguiente</button>
      </nav>
    }
  </section>
}
