<app-page-header title="Administradores de plataforma" subtitle="Consulta y administra el acceso de los administradores del sitio." />
<section class="card">
  <div class="list-actions-bar">
    <a class="button primary" routerLink="/app/admin/register">Registrar administrador</a>
    <a class="button" routerLink="/app/admin/users">Ver usuarios</a>
  </div>
  <form class="form-grid" [formGroup]="form" (submit)="$event.preventDefault()">
    <label>Correo<input type="search" formControlName="email" placeholder="Buscar por correo" maxlength="100" /></label>
    <label>Nombre o apellidos<input type="search" formControlName="search" placeholder="Buscar por nombre o apellidos" maxlength="100" /></label>
    <div><button type="button" (click)="clearFilters()">Limpiar filtros</button></div>
  </form>
  @if (loading()) { <app-skeleton /> }
  @else if (failed()) {
    <p role="alert">No pudimos cargar los administradores.</p>
    <button type="button" (click)="load()">Reintentar</button>
  } @else {
    <app-data-table caption="Administradores de plataforma" [columns]="columns" [rows]="rows()" [actions]="actions" (rowAction)="handleAction($event)" />
    <nav class="pagination" aria-label="Paginación de administradores">
      <button type="button" [disabled]="page() <= 1 || busy()" (click)="load(page() - 1)">Anterior</button>
      <span>{{ total() }} administradores · Página {{ page() }} de {{ totalPages() || 1 }}</span>
      <button type="button" [disabled]="page() >= totalPages() || busy()" (click)="load(page() + 1)">Siguiente</button>
    </nav>
  }
</section>
<app-confirm-dialog title="Cambiar estado del administrador" [message]="confirmationMessage()" [confirmLabel]="pending()?.isActive ? 'Activar' : 'Desactivar'" (confirmed)="changeStatus()" />
