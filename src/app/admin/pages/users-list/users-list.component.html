<app-page-header title="Usuarios de la plataforma" subtitle="Consulta dueños, gerentes, vendedores y otros usuarios. Administra su acceso global." />
<section class="card">
  <div class="user-filters">
    <label>Buscar usuario<input type="search" placeholder="Nombre, apellidos o correo" maxlength="50" (input)="onSearch($event)" /></label>
    <div class="filter-field">
      <span>Rol</span>
      <app-catalog-select [fetchFn]="fetchRoles" [formControl]="roleControl" placeholder="Todos los roles" />
      @if (roleControl.value) { <button class="clear-filter" type="button" (click)="clearRole()">Quitar filtro de rol</button> }
    </div>
    <div class="filter-field">
      <span>Tienda</span>
      <app-catalog-select [fetchFn]="fetchStores" [formControl]="storeControl" placeholder="Todas las tiendas" />
      @if (storeControl.value) { <button class="clear-filter" type="button" (click)="clearStore()">Quitar filtro de tienda</button> }
    </div>
  </div>
  @if (loading()) { <app-skeleton /> }
  @else if (failed()) {
    <p role="alert">No pudimos cargar los usuarios.</p><button type="button" (click)="load()">Reintentar</button>
  } @else {
    <app-data-table caption="Usuarios de la plataforma" [columns]="columns" [rows]="rows()" [actions]="actions" (rowAction)="handleAction($event)" />
    <nav class="pagination" aria-label="Paginación de usuarios">
      <button type="button" [disabled]="page() <= 1 || busy()" (click)="load(page() - 1)">Anterior</button>
      <span>{{ total() }} usuarios · Página {{ page() }} de {{ totalPages() || 1 }}</span>
      <button type="button" [disabled]="page() >= totalPages() || busy()" (click)="load(page() + 1)">Siguiente</button>
    </nav>
  }
</section>
<app-confirm-dialog title="Cambiar estado del usuario" [message]="confirmationMessage()" [confirmLabel]="targetActive() ? 'Activar' : 'Desactivar'" (confirmed)="changeStatus()" />
