<app-page-header title="Clientes" subtitle="Consulta y administra los clientes de la tienda seleccionada." />
@if (!selectedStore.selectedStoreId()) {
  <section class="card"><p>Selecciona una tienda para consultar sus clientes.</p></section>
} @else {
  <section class="card">
    <div class="list-actions">
      <form (submit)="$event.preventDefault()">
        <label>Buscar cliente<input appInput type="search" name="search" [ngModel]="search" (ngModelChange)="onSearch($event)" maxlength="50" placeholder="Nombre, apellidos o correo" /></label>
      </form>
      @if (auth.hasPermission('manage_clients')) { <a class="button primary" routerLink="/app/register-clients">Registrar cliente</a> }
    </div>
    @if (loading()) { <app-skeleton /> }
    @else if (error()) { <p role="alert" class="error">{{ error() }}</p><button type="button" (click)="load()">Reintentar</button> }
    @else {
      <app-data-table caption="Clientes de la tienda" [columns]="columns" [rows]="rows()" [actions]="actions()" (rowAction)="handleAction($event)" />
      <app-pagination label="Paginación de resultados" [page]="page" [totalPages]="totalPages()" [total]="total()"
    [pageSize]="pageSize" [disabled]="busy()" (pageChange)="load($event)" (pageSizeChange)="changePageSize($event)" />
    }
  </section>
}
<app-confirm-dialog title="Cambiar estado del cliente" [message]="'Se ' + (pending()?.isActive) + ' a ' + (pending()?.name || '') + '.'" confirmLabel="Confirmar" (confirmed)="toggle()" />
