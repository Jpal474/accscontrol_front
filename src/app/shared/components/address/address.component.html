<fieldset [formGroup]="form()">
  <legend>{{ title() }}</legend>
  <div class="fields">
    <!-- Calle -->
    <label [for]="prefix() + '-street'">
      Calle
      <input
        [id]="prefix() + '-street'"
        formControlName="street"
        autocomplete="address-line1"
        placeholder="Av. Madero"
        required
      />
    </label>

    <!-- Número exterior -->
    <label [for]="prefix() + '-externalNumber'">
      Núm. Exterior
      <input
        [id]="prefix() + '-externalNumber'"
        formControlName="externalNumber"
        placeholder="123"
        required
      />
    </label>

    <!-- Número interior -->
    <label [for]="prefix() + '-internalNumber'">
      Núm. Interior (Opcional)
      <input
        [id]="prefix() + '-internalNumber'"
        formControlName="internalNumber"
        placeholder="Depto 4B"
      />
    </label>

    <!-- Colonia / Barrio -->
    <label [for]="prefix() + '-neighborhood'">
      Colonia
      <input
        [id]="prefix() + '-neighborhood'"
        formControlName="neighborhood"
        placeholder="Centro"
        required
      />
    </label>

    <!-- Código Postal -->
    <label [for]="prefix() + '-postal'">
      Código postal
      <input
        [id]="prefix() + '-postal'"
        formControlName="postalCode"
        autocomplete="postal-code"
        placeholder="58000"
        required
      />
    </label>

    <!-- Catálogo de País (Siempre disponible) -->
    <label>
      <span>País</span>
      <app-catalog-select
        formControlName="countryId"
        [fetchFn]="fetchCountries"
        placeholder="Selecciona un país..."
      />
    </label>

    <!-- Catálogo de Estado (Requiere País) -->
    <label>
      <span>Estado / Región</span>
      <app-catalog-select
        formControlName="stateId"
        [parentId]="form().get('countryId')?.value"
        [fetchFn]="fetchStates"
        [parentRequired]="true"
        [placeholder]="
          form().get('countryId')?.value
            ? 'Selecciona un estado...'
            : 'Primero selecciona un país'
        "
      />
    </label>

    <!-- Catálogo de Municipio (Requiere Estado) -->
    <label>
      <span>Municipio</span>
      <app-catalog-select
        formControlName="municipalityId"
        [parentId]="form().get('stateId')?.value"
        [fetchFn]="fetchMunicipalities"
        [parentRequired]="true"
        [placeholder]="
          form().get('stateId')?.value
            ? 'Selecciona un municipio...'
            : 'Primero selecciona un estado'
        "
      />
    </label>

    <!-- Catálogo de Localidad (Requiere Municipio) -->
    <label>
      <span>Localidad</span>
      <app-catalog-select
        formControlName="localityId"
        [parentId]="form().get('municipalityId')?.value"
        [fetchFn]="fetchLocalities"
        [parentRequired]="true"
        [placeholder]="
          form().get('municipalityId')?.value
            ? 'Selecciona una localidad...'
            : 'Primero selecciona un municipio'
        "
      />
    </label>
  </div>

  @if (form().touched && form().invalid) {
    <p role="alert" class="form-error">
      Completa todos los campos obligatorios de la dirección y selecciona las
      ubicaciones de los catálogos.
    </p>
  }
</fieldset>
